<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/note.css" />
  </head>
  <body>
    <div class="note-shell">
      <div class="note-card is-opening">
        <div class="note-header drag-region">
          <div id="noteHeaderFocusZone" class="note-header-focus-zone no-drag" aria-hidden="true"></div>
          <button id="pinBtn" class="pin-toggle no-drag" aria-label="置顶">
            <img class="pin-toggle-icon" src="./assets/icons/pin.svg" alt="" />
          </button>
          <div class="note-header-center no-drag">
            <div class="note-collection-picker">
              <select id="noteCollectionSelect" class="note-collection-select"></select>
              <span class="note-collection-caret" aria-hidden="true"></span>
            </div>
            <span id="noteHeaderTitle" class="note-header-title">新建笔记</span>
          </div>
          <button id="closeNote" class="icon-btn no-drag" aria-label="关闭">
            <img src="./assets/icons/close.svg" alt="" />
          </button>
        </div>
        <div id="noteBody" class="note-body">
          <input id="noteTitle" class="note-title" placeholder="标题" />
          <div id="noteAttachments" class="attachments"></div>
          <div id="noteToolbar" class="toolbar">
            <div class="toolbar-group toolbar-group-accent">
              <button id="noteRecordBtn" class="tool-btn" aria-label="录音">
                <img src="./assets/icons/record.svg" alt="" />
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button id="noteImageBtn" class="tool-btn" aria-label="插入图片">
                <img src="./assets/icons/toolbar-picture.svg" alt="" />
              </button>
            </div>
            <div class="toolbar-group toolbar-group-edit">
              <button id="fontPlus" class="tool-btn" aria-label="放大字号">
                <img src="./assets/icons/toolbar-font-plus.svg" alt="" />
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button id="fontMinus" class="tool-btn" aria-label="缩小字号">
                <img src="./assets/icons/toolbar-font-minus.svg" alt="" />
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button id="noteHighlightBtn" class="tool-btn" aria-label="高亮">
                <img src="./assets/icons/highlight.svg" alt="" />
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button id="noteBoldBtn" class="tool-btn" aria-label="加粗">
                <img src="./assets/icons/bold.svg" alt="" />
              </button>
              <span class="toolbar-divider" aria-hidden="true"></span>
              <button id="noteStrikeBtn" class="tool-btn" aria-label="划掉">
                <img src="./assets/icons/toolbar-strikethrough.svg" alt="" />
              </button>
            </div>
          </div>
          <div id="noteContent" class="content-editor scrollbar-hidden" contenteditable="false"></div>
        </div>
        <div class="note-footer">
          <div class="tag-row">
            <button id="noteCalendarBtn" class="note-calendar-btn" type="button" aria-label="选择计划日期">
              <img src="./assets/icons/note-calendar.svg" alt="" />
            </button>
            <span id="noteDateTag" class="note-date-tag hidden"></span>
            <span>标签:</span>
            <input id="noteTags" placeholder="标签用逗号分隔" />
          </div>
          <button id="saveNoteBtn" class="save-btn" aria-label="保存">
            <img src="./assets/icons/save.svg" alt="" />
          </button>
        </div>
        <div id="noteCalendarPopover" class="note-calendar-popover hidden">
          <div class="note-calendar-popover-header">
            <button id="noteCalendarPrevBtn" class="note-calendar-nav-btn" type="button" aria-label="上个月">&#8249;</button>
            <button id="noteCalendarMonthBtn" class="note-calendar-month-btn" type="button"></button>
            <button id="noteCalendarNextBtn" class="note-calendar-nav-btn" type="button" aria-label="下个月">&#8250;</button>
            <button id="noteCalendarClearBtn" class="note-calendar-clear-btn" type="button">清除</button>
            <input id="noteCalendarMonthInput" class="note-calendar-month-input" type="month" />
          </div>
          <div class="note-calendar-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div id="noteCalendarGrid" class="note-calendar-grid"></div>
        </div>
        <div id="noteResizeHandle" class="note-resize-handle no-drag" aria-hidden="true"></div>
      </div>
    </div>
    <script src="./js/note.js"></script>
  </body>
</html>
