<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicknote</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/quicknote.css" />
  </head>
  <body>
    <div id="quicknoteShell" class="quicknote-shell mini">
      <div class="quicknote-card">
        <div class="quicknote-header drag-region">
          <div class="archive-select no-drag">
            <select id="collectionSelect" class="compact-select"></select>
            <span id="notePathDivider" class="path-divider">/</span>
            <select id="noteSelect" class="compact-select"></select>
          </div>
          <button id="closeQuicknote" class="icon-btn no-drag" aria-label="&#20851;&#38381;">
            <img id="closeQuicknoteIcon" src="./assets/icons/close.svg" alt="" />
          </button>
        </div>
        <div class="quicknote-body">
          <input id="titleInput" class="title-input" placeholder="&#26631;&#39064;&#65288;&#21487;&#36873;&#65289;" />
          <div id="attachmentRow" class="attachments"></div>
          <div id="contentEditor" class="content-editor scrollbar-hidden" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="&#24555;&#36895;&#35760;&#24405;..."></div>
        </div>
        <div class="quicknote-footer no-drag">
          <button id="expandQuicknoteBtn" class="expand-quicknote-btn" aria-label="&#23637;&#24320;&#25110;&#25910;&#36215;">
            <img src="./assets/icons/expand.svg" alt="" />
          </button>
          <div class="quicknote-toolbar-frame">
            <div class="quicknote-toolbar-group quicknote-toolbar-group-accent">
              <button id="recordBtn" class="toolbar-btn" aria-label="&#24405;&#38899;">
                <img src="./assets/icons/record.svg" alt="" />
              </button>
            </div>
            <div class="quicknote-toolbar-group quicknote-toolbar-group-main">
              <button id="highlightBtn" class="toolbar-btn" aria-label="&#39640;&#20142;">
                <img src="./assets/icons/highlight.svg" alt="" />
              </button>
              <span class="quicknote-toolbar-divider" aria-hidden="true"></span>
              <button id="boldBtn" class="toolbar-btn" aria-label="&#21152;&#31895;">
                <img src="./assets/icons/bold.svg" alt="" />
              </button>
            </div>
          </div>
          <button id="saveQuicknoteBtn" class="save-quicknote-btn" aria-label="&#20445;&#23384;">
            <img src="./assets/icons/save.svg" alt="" />
          </button>
        </div>
      </div>
    </div>
    <script src="./js/quicknote.js"></script>
  </body>
</html>
