<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: file:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quicknote</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/quicknote.css" />
  </head>
  <body>
    <div class="quicknote-shell">
      <div class="quicknote-card">
        <div class="quicknote-header drag-region">
          <div class="archive-select no-drag">
            <select id="collectionSelect"></select>
            /
            <select id="noteSelect"></select>
          </div>
          <button id="closeQuicknote" class="icon-btn no-drag" aria-label="&#20851;&#38381;">
            <img src="./assets/icons/close.svg" alt="" />
          </button>
        </div>
        <div class="quicknote-body">
          <input id="titleInput" class="title-input" placeholder="&#26631;&#39064;&#65288;&#21487;&#36873;&#65289;" />
          <div id="attachmentRow" class="attachments"></div>
          <div id="contentEditor" class="content-editor scrollbar-hidden" contenteditable="true"></div>
        </div>
        <div class="quicknote-footer no-drag">
          <button id="recordBtn" class="toolbar-btn" aria-label="&#24405;&#38899;">
            <img src="./assets/icons/record.svg" alt="" />
          </button>
          <button id="highlightBtn" class="toolbar-btn" aria-label="&#39640;&#20142;">
            <img src="./assets/icons/highlight.svg" alt="" />
          </button>
          <button id="boldBtn" class="toolbar-btn" aria-label="&#21152;&#31895;">
            <img src="./assets/icons/bold.svg" alt="" />
          </button>
          <button id="saveQuicknoteBtn" class="save-quicknote-btn">&#35760;&#19979;&#26469;</button>
        </div>
      </div>
    </div>
    <script src="./js/quicknote.js"></script>
  </body>
</html>
